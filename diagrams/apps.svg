<rect x="40" y="150" width="260" height="92" rx="6" fill="#0f172a"/><rect x="40" y="150" width="260" height="92" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Browser</text><text x="52" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">daymark.lan.hashirowais.com</text><text x="52" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">Expo web bundle</text><text x="288" y="171" fill="#94a3b8" font-size="10" text-anchor="end">LAN/VPN</text>
<rect x="40" y="272" width="260" height="92" rx="6" fill="#0f172a"/><rect x="40" y="272" width="260" height="92" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="294" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Hermes agent</text><text x="52" y="310" fill="#cbd5e1" font-size="10.5" text-anchor="start">MCP client, same host</text><text x="52" y="326" fill="#cbd5e1" font-size="10.5" text-anchor="start">reads and writes tasks</text><text x="288" y="293" fill="#94a3b8" font-size="10" text-anchor="end">vm</text>
<rect x="40" y="394" width="260" height="78" rx="6" fill="#0f172a"/><rect x="40" y="394" width="260" height="78" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="52" y="416" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Nothing public</text><text x="52" y="432" fill="#cbd5e1" font-size="10.5" text-anchor="start">no port forward, no public DNS</text><text x="288" y="415" fill="#fb7185" font-size="10" text-anchor="end">—</text>
<rect x="330" y="150" width="290" height="214" rx="6" fill="#0f172a"/><rect x="330" y="150" width="290" height="214" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="342" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Traefik</text><text x="342" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">LoadBalancer 192.168.69.202</text><text x="342" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">one entrypoint on :443</text><text x="342" y="220" fill="#cbd5e1" font-size="10.5" text-anchor="start">wildcard *.lan.hashirowais.com</text><text x="342" y="236" fill="#cbd5e1" font-size="10.5" text-anchor="start"></text><text x="342" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="start">Ingress rules for one host:</text><text x="342" y="268" fill="#cbd5e1" font-size="10.5" text-anchor="start">/api  →  daymark-api:80</text><text x="342" y="284" fill="#cbd5e1" font-size="10.5" text-anchor="start">/     →  daymark-web:80</text><text x="342" y="300" fill="#cbd5e1" font-size="10.5" text-anchor="start">same origin, so no CORS</text><text x="608" y="171" fill="#22d3ee" font-size="10" text-anchor="end">:443</text>
<rect x="650" y="150" width="310" height="96" rx="6" fill="#0f172a"/><rect x="650" y="150" width="310" height="96" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="662" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">daymark-web</text><text x="662" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">nginx-unprivileged :8080</text><text x="662" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">static files, GET only</text><text x="948" y="171" fill="#34d399" font-size="10" text-anchor="end">ns daymark</text>
<rect x="650" y="272" width="310" height="156" rx="6" fill="#0f172a"/><rect x="650" y="272" width="310" height="156" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="662" y="294" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">daymark-api</text><text x="662" y="310" fill="#cbd5e1" font-size="10.5" text-anchor="start">Go binary :8080, uid 10001</text><text x="662" y="326" fill="#cbd5e1" font-size="10.5" text-anchor="start">REST under /api</text><text x="662" y="342" fill="#cbd5e1" font-size="10.5" text-anchor="start">MCP endpoint for agents</text><text x="662" y="358" fill="#cbd5e1" font-size="10.5" text-anchor="start">/api/health for probes</text><text x="662" y="374" fill="#cbd5e1" font-size="10.5" text-anchor="start">DATABASE_URL from a Secret</text><text x="948" y="293" fill="#34d399" font-size="10" text-anchor="end">ns daymark</text>
<rect x="990" y="150" width="390" height="90" rx="6" fill="#0f172a"/><rect x="990" y="150" width="390" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1002" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">pg-rw</text><text x="1002" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">pg-rw.pg.svc.cluster.local:5432</text><text x="1002" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">CNPG read-write service</text><text x="1368" y="171" fill="#a78bfa" font-size="10" text-anchor="end">svc</text>
<rect x="990" y="270" width="390" height="110" rx="6" fill="#0f172a"/><rect x="990" y="270" width="390" height="110" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1002" y="292" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">pg — primary</text><text x="1002" y="308" fill="#cbd5e1" font-size="10.5" text-anchor="start">namespace pg, 1 instance</text><text x="1002" y="324" fill="#cbd5e1" font-size="10.5" text-anchor="start">database daymark · role daymark_app</text><text x="1002" y="340" fill="#cbd5e1" font-size="10.5" text-anchor="start">sslmode=require enforced</text><text x="1368" y="291" fill="#a78bfa" font-size="10" text-anchor="end">cnpg</text>
<rect x="990" y="410" width="180" height="84" rx="6" fill="#0f172a"/><rect x="990" y="410" width="180" height="84" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1002" y="432" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">PVC 20Gi</text><text x="1002" y="448" fill="#cbd5e1" font-size="10.5" text-anchor="start">storageClass longhorn</text>
<rect x="1200" y="410" width="180" height="84" rx="6" fill="#0f172a"/><rect x="1200" y="410" width="180" height="84" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="1212" y="432" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Longhorn</text><text x="1212" y="448" fill="#cbd5e1" font-size="10.5" text-anchor="start">3 replicas</text><text x="1212" y="464" fill="#cbd5e1" font-size="10.5" text-anchor="start">one per node</text>
<rect x="60" y="612" width="250" height="84" rx="6" fill="#0f172a"/><rect x="60" y="612" width="250" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="72" y="634" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">daymark api + web</text><text x="72" y="650" fill="#cbd5e1" font-size="10.5" text-anchor="start">OTLP metrics and traces</text>
<rect x="60" y="712" width="250" height="68" rx="6" fill="#0f172a"/><rect x="60" y="712" width="250" height="68" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="72" y="734" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">OPNsense + nodes</text><text x="72" y="750" fill="#cbd5e1" font-size="10.5" text-anchor="start">DHCP, DNS, Suricata, kubelet</text>
<rect x="400" y="640" width="230" height="110" rx="6" fill="#0f172a"/><rect x="400" y="640" width="230" height="110" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="412" y="662" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">OTel collector</text><text x="412" y="678" fill="#cbd5e1" font-size="10.5" text-anchor="start">one pipeline</text><text x="412" y="694" fill="#cbd5e1" font-size="10.5" text-anchor="start">batches, then exports</text><text x="618" y="661" fill="#34d399" font-size="10" text-anchor="end">otel</text>
<rect x="710" y="640" width="210" height="110" rx="6" fill="#0f172a"/><rect x="710" y="640" width="210" height="110" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="722" y="662" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Grafana</text><text x="722" y="678" fill="#cbd5e1" font-size="10.5" text-anchor="start">dashboards for every</text><text x="722" y="694" fill="#cbd5e1" font-size="10.5" text-anchor="start">source above</text><text x="908" y="661" fill="#22d3ee" font-size="10" text-anchor="end">viz</text>
