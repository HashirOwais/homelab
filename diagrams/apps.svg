<text x="970" y="668" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">Grafana is the only place these meet: a</text>
<text x="970" y="684" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">slow /api request and the DHCP lease</text>
<text x="970" y="700" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">that identifies the device share a</text>
<text x="970" y="716" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">timestamp column, not a dashboard.</text>
<text x="40" y="850" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">Order of a POST /api/…: 1 ingress → 2 web (page load only) → 3 api → 4 pg-rw → 5 primary → 6 volume</text>
