</defs>
<rect width="1420" height="950" fill="#020617"/>
<rect width="1420" height="950" fill="url(#grid)"/>
<text x="40" y="50" fill="#e2e8f0" font-size="22" font-weight="600">Applications</text>
<text x="40" y="75" fill="#94a3b8" font-size="12">One host, two backends, one database — how a request reaches Daymark and where the data sits</text>
<rect x="40" y="560" width="1340" height="240" rx="10" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="54" y="581" fill="#34d399" font-size="12" letter-spacing="0.6">Telemetry</text>
<text x="54" y="597" fill="#94a3b8" font-size="10">the same request, seen from three sides</text>
