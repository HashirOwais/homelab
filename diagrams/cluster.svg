<rect width="1420" height="900" fill="#020617"/>
<rect width="1420" height="900" fill="url(#grid)"/>
<text x="40" y="50" fill="#e2e8f0" font-size="22" font-weight="600">Cluster</text>
<text x="40" y="75" fill="#94a3b8" font-size="12">git is the source of truth: CI builds the image, ArgoCD makes the cluster match the manifests</text>
<rect x="40" y="300" width="1340" height="490" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="54" y="321" fill="#fbbf24" font-size="12" letter-spacing="0.6">k3s — 3 nodes, all control-plane, embedded etcd</text>
<text x="54" y="337" fill="#94a3b8" font-size="10">one API server each; MetalLB advertises the VIPs from node interfaces</text>
<path d="M 310 145 L 350 145" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#am-frontend)"/>
<path d="M 600 145 L 640 145" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#am-frontend)"/>
<path d="M 175 190 L 175 297" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#am-backend)"/>
<path d="M 765 190 L 765 297" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#am-frontend)"/>
<rect x="40" y="100" width="270" height="90" rx="6" fill="#0f172a"/><rect x="40" y="100" width="270" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="122" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Git repo</text><text x="52" y="138" fill="#cbd5e1" font-size="10.5" text-anchor="start">github.com/HashirOwais/homelab</text><text x="52" y="154" fill="#cbd5e1" font-size="10.5" text-anchor="start">manifests + kustomize-free YAML</text><text x="298" y="121" fill="#94a3b8" font-size="10" text-anchor="end">src</text>
<rect x="350" y="100" width="250" height="90" rx="6" fill="#0f172a"/><rect x="350" y="100" width="250" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="362" y="122" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">GitHub Actions</text><text x="362" y="138" fill="#cbd5e1" font-size="10.5" text-anchor="start">builds api + web images</text><text x="362" y="154" fill="#cbd5e1" font-size="10.5" text-anchor="start">on tag</text><text x="588" y="121" fill="#22d3ee" font-size="10" text-anchor="end">ci</text>
<rect x="640" y="100" width="250" height="90" rx="6" fill="#0f172a"/><rect x="640" y="100" width="250" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="652" y="122" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">GHCR</text><text x="652" y="138" fill="#cbd5e1" font-size="10.5" text-anchor="start">ghcr.io/hashirowais/*</text><text x="652" y="154" fill="#cbd5e1" font-size="10.5" text-anchor="start">immutable tag = release</text><text x="878" y="121" fill="#22d3ee" font-size="10" text-anchor="end">reg</text>
<rect x="960" y="100" width="420" height="90" rx="6" fill="#0f172a"/><rect x="960" y="100" width="420" height="90" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="972" y="122" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Reconcile loop</text><text x="972" y="138" fill="#cbd5e1" font-size="10.5" text-anchor="start">ArgoCD diffs live state against git</text><text x="972" y="154" fill="#cbd5e1" font-size="10.5" text-anchor="start">and applies the difference</text><text x="1368" y="121" fill="#34d399" font-size="10" text-anchor="end">argocd</text>
<rect x="60" y="355" width="260" height="80" rx="6" fill="#0f172a"/><rect x="60" y="355" width="260" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="72" y="377" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node-01</text><text x="72" y="393" fill="#cbd5e1" font-size="10.5" text-anchor="start">192.168.69.37</text><text x="72" y="409" fill="#cbd5e1" font-size="10.5" text-anchor="start">k3s server · etcd member</text>
<rect x="340" y="355" width="260" height="80" rx="6" fill="#0f172a"/><rect x="340" y="355" width="260" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="352" y="377" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node-02</text><text x="352" y="393" fill="#cbd5e1" font-size="10.5" text-anchor="start">192.168.69.38</text><text x="352" y="409" fill="#cbd5e1" font-size="10.5" text-anchor="start">k3s server · etcd member</text>
<rect x="620" y="355" width="260" height="80" rx="6" fill="#0f172a"/><rect x="620" y="355" width="260" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="632" y="377" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node-03</text><text x="632" y="393" fill="#cbd5e1" font-size="10.5" text-anchor="start">192.168.69.34</text><text x="632" y="409" fill="#cbd5e1" font-size="10.5" text-anchor="start">k3s server · etcd member</text>
<rect x="60" y="465" width="310" height="112" rx="6" fill="#0f172a"/><rect x="60" y="465" width="310" height="112" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="72" y="487" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">metallb-system</text><text x="72" y="503" fill="#cbd5e1" font-size="10.5" text-anchor="start">L2 pool 192.168.69.202–210</text><text x="72" y="519" fill="#cbd5e1" font-size="10.5" text-anchor="start">one VIP per LoadBalancer</text><text x="72" y="535" fill="#cbd5e1" font-size="10.5" text-anchor="start">answered by one node (ARP)</text><text x="72" y="551" fill="#cbd5e1" font-size="10.5" text-anchor="start">no BGP to configure</text><text x="358" y="486" fill="#22d3ee" font-size="10" text-anchor="end">net</text>
<rect x="390" y="465" width="310" height="112" rx="6" fill="#0f172a"/><rect x="390" y="465" width="310" height="112" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="402" y="487" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">kube-system</text><text x="402" y="503" fill="#cbd5e1" font-size="10.5" text-anchor="start">Traefik LoadBalancer .202</text><text x="402" y="519" fill="#cbd5e1" font-size="10.5" text-anchor="start">:80 and :443 entrypoints</text><text x="402" y="535" fill="#cbd5e1" font-size="10.5" text-anchor="start">serves the wildcard cert</text><text x="402" y="551" fill="#cbd5e1" font-size="10.5" text-anchor="start">TLSStore holds the default</text><text x="688" y="486" fill="#22d3ee" font-size="10" text-anchor="end">traefik</text>
<rect x="720" y="465" width="310" height="112" rx="6" fill="#0f172a"/><rect x="720" y="465" width="310" height="112" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="732" y="487" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">cert-manager</text><text x="732" y="503" fill="#cbd5e1" font-size="10.5" text-anchor="start">Cloudflare DNS-01 issuer</text><text x="732" y="519" fill="#cbd5e1" font-size="10.5" text-anchor="start">*.lan.hashirowais.com</text><text x="732" y="535" fill="#cbd5e1" font-size="10.5" text-anchor="start">secret wildcard-lan-tls</text><text x="732" y="551" fill="#cbd5e1" font-size="10.5" text-anchor="start">renews without a restart</text><text x="1018" y="486" fill="#fb7185" font-size="10" text-anchor="end">tls</text>
<rect x="1050" y="465" width="310" height="112" rx="6" fill="#0f172a"/><rect x="1050" y="465" width="310" height="112" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="1062" y="487" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">longhorn-system</text><text x="1062" y="503" fill="#cbd5e1" font-size="10.5" text-anchor="start">default StorageClass</text><text x="1062" y="519" fill="#cbd5e1" font-size="10.5" text-anchor="start">3 replicas per volume</text><text x="1062" y="535" fill="#cbd5e1" font-size="10.5" text-anchor="start">one replica per node</text><text x="1062" y="551" fill="#cbd5e1" font-size="10.5" text-anchor="start">expands online, no shrink</text><text x="1348" y="486" fill="#fbbf24" font-size="10" text-anchor="end">block</text>
<rect x="60" y="598" width="310" height="112" rx="6" fill="#0f172a"/><rect x="60" y="598" width="310" height="112" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="72" y="620" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">cnpg-system</text><text x="72" y="636" fill="#cbd5e1" font-size="10.5" text-anchor="start">CloudNativePG operator</text><text x="72" y="652" fill="#cbd5e1" font-size="10.5" text-anchor="start">one pod + admission hooks</text><text x="72" y="668" fill="#cbd5e1" font-size="10.5" text-anchor="start">watches Cluster objects</text><text x="72" y="684" fill="#cbd5e1" font-size="10.5" text-anchor="start">installed by Helm 0.29.1</text><text x="358" y="619" fill="#34d399" font-size="10" text-anchor="end">operator</text>
<rect x="390" y="598" width="310" height="112" rx="6" fill="#0f172a"/><rect x="390" y="598" width="310" height="112" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="402" y="620" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">pg</text><text x="402" y="636" fill="#cbd5e1" font-size="10.5" text-anchor="start">Cluster pg — 1 instance</text><text x="402" y="652" fill="#cbd5e1" font-size="10.5" text-anchor="start">pg-rw · pg-ro · pg-r</text><text x="402" y="668" fill="#cbd5e1" font-size="10.5" text-anchor="start">pg-lb 192.168.69.203</text><text x="402" y="684" fill="#cbd5e1" font-size="10.5" text-anchor="start">20Gi Longhorn PVC</text><text x="688" y="619" fill="#a78bfa" font-size="10" text-anchor="end">postgres</text>
<rect x="720" y="598" width="310" height="112" rx="6" fill="#0f172a"/><rect x="720" y="598" width="310" height="112" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="732" y="620" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">daymark</text><text x="732" y="636" fill="#cbd5e1" font-size="10.5" text-anchor="start">api :8080 · web :8080</text><text x="732" y="652" fill="#cbd5e1" font-size="10.5" text-anchor="start">daymark.lan.hashirowais.com</text><text x="732" y="668" fill="#cbd5e1" font-size="10.5" text-anchor="start">db daymark, role daymark_app</text><text x="732" y="684" fill="#cbd5e1" font-size="10.5" text-anchor="start">/api → api, / → web</text><text x="1018" y="619" fill="#34d399" font-size="10" text-anchor="end">app</text>
<rect x="1050" y="598" width="310" height="112" rx="6" fill="#0f172a"/><rect x="1050" y="598" width="310" height="112" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="1062" y="620" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">argocd</text><text x="1062" y="636" fill="#cbd5e1" font-size="10.5" text-anchor="start">applies infrastructure/ + apps/</text><text x="1062" y="652" fill="#cbd5e1" font-size="10.5" text-anchor="start">syncs on every git change</text><text x="1062" y="668" fill="#cbd5e1" font-size="10.5" text-anchor="start">prunes what git dropped</text><text x="1062" y="684" fill="#cbd5e1" font-size="10.5" text-anchor="start">no kubectl apply in normal use</text><text x="1348" y="619" fill="#34d399" font-size="10" text-anchor="end">gitops</text>
<text x="330.0" y="137.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">push</text>
<text x="620.0" y="137.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">push</text>
<text x="221.0" y="243.5" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">manifests</text>
<text x="813.0" y="243.5" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">image pull</text>
<text x="940" y="385" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">each node also runs a Longhorn replica,</text>
<text x="940" y="401" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">so every volume keeps 3 copies</text>
<text x="940" y="417" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">and survives one node going away</text>
<text x="40" y="822" fill="#94a3b8" font-size="10" letter-spacing="1">LEGEND</text>
