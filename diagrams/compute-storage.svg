<rect width="1420" height="990" fill="url(#grid)"/>
<text x="40" y="50" fill="#e2e8f0" font-size="22" font-weight="600">Compute and storage</text>
<text x="40" y="75" fill="#94a3b8" font-size="12">Four Optiplexes, one NAS, and the two paths data takes out of the cluster</text>
<rect x="40" y="100" width="460" height="340" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="54" y="121" fill="#fbbf24" font-size="12" letter-spacing="0.6">k3s cluster — 3 × Optiplex</text>
<text x="54" y="137" fill="#94a3b8" font-size="10">control-plane + embedded etcd</text>
<rect x="530" y="100" width="430" height="340" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="544" y="121" fill="#fbbf24" font-size="12" letter-spacing="0.6">Proxmox VE — Optiplex #4</text>
<text x="544" y="137" fill="#94a3b8" font-size="10">hypervisor, outside k3s</text>
<rect x="980" y="100" width="400" height="340" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="994" y="121" fill="#fbbf24" font-size="12" letter-spacing="0.6">TrueNAS — 192.168.69.23</text>
<text x="994" y="137" fill="#94a3b8" font-size="10">2.5GbE, ZFS</text>
