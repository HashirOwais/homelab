<text x="368.0" y="931" fill="#cbd5e1" font-size="11">database / volume</text>
<rect x="512.2" y="919" width="14" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="534.2" y="931" fill="#cbd5e1" font-size="11">host / storage</text>
<rect x="658.6" y="919" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="680.6" y="931" fill="#cbd5e1" font-size="11">security</text>
<rect x="765.4" y="919" width="14" height="14" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="787.4" y="931" fill="#cbd5e1" font-size="11">external</text>
