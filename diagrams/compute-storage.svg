<text x="62" y="931" fill="#cbd5e1" font-size="11">firewall / ingress</text>
<rect x="212.8" y="919" width="14" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="234.8" y="931" fill="#cbd5e1" font-size="11">service / VM</text>
