<rect x="56" y="228" width="428" height="70" rx="6" fill="#0f172a"/><rect x="56" y="228" width="428" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="250" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node-02</text><text x="68" y="266" fill="#cbd5e1" font-size="10.5" text-anchor="start">192.168.69.38 · k3s server · etcd member</text>
<rect x="56" y="306" width="428" height="70" rx="6" fill="#0f172a"/><rect x="56" y="306" width="428" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="328" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node-03</text><text x="68" y="344" fill="#cbd5e1" font-size="10.5" text-anchor="start">192.168.69.34 · k3s server · etcd member</text>
<rect x="546" y="150" width="398" height="96" rx="6" fill="#0f172a"/><rect x="546" y="150" width="398" height="96" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="558" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Hermes harness VM</text><text x="558" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">agentic runner: plans, calls MCP</text><text x="558" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">reads and writes Daymark tasks</text><text x="932" y="171" fill="#34d399" font-size="10" text-anchor="end">vm</text>
<rect x="546" y="256" width="398" height="96" rx="6" fill="#0f172a"/><rect x="546" y="256" width="398" height="96" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="558" y="278" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Wazuh VM</text><text x="558" y="294" fill="#cbd5e1" font-size="10.5" text-anchor="start">SIEM: endpoint + firewall events</text><text x="558" y="310" fill="#cbd5e1" font-size="10.5" text-anchor="start">alerts on rule matches</text><text x="932" y="277" fill="#fb7185" font-size="10" text-anchor="end">vm</text>
<rect x="546" y="362" width="398" height="64" rx="6" fill="#0f172a"/><rect x="546" y="362" width="398" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="558" y="384" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Fedora Docker host</text><text x="558" y="400" fill="#cbd5e1" font-size="10.5" text-anchor="start">n8n :5678 · NPM :80/443/81 · Termix :8080</text><text x="932" y="383" fill="#94a3b8" font-size="10" text-anchor="end">opt</text>
<rect x="996" y="150" width="368" height="82" rx="6" fill="#0f172a"/><rect x="996" y="150" width="368" height="82" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="1008" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">NFS exports</text><text x="1008" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">back the PVCs that need bulk</text><text x="1008" y="204" fill="#cbd5e1" font-size="10.5" text-anchor="start">space (NFS v4)</text><text x="1352" y="171" fill="#fbbf24" font-size="10" text-anchor="end">nfs</text>
<rect x="996" y="242" width="368" height="82" rx="6" fill="#0f172a"/><rect x="996" y="242" width="368" height="82" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="1008" y="264" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">ZFS pool</text><text x="1008" y="280" fill="#cbd5e1" font-size="10.5" text-anchor="start">checksums, scrub, per-dataset</text><text x="1008" y="296" fill="#cbd5e1" font-size="10.5" text-anchor="start">snapshots</text><text x="1352" y="263" fill="#fbbf24" font-size="10" text-anchor="end">zfs</text>
<rect x="996" y="334" width="368" height="92" rx="6" fill="#0f172a"/><rect x="996" y="334" width="368" height="92" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="1008" y="356" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Backup jobs</text><text x="1008" y="372" fill="#cbd5e1" font-size="10.5" text-anchor="start">etcd snapshots + PV tarballs</text><text x="1008" y="388" fill="#cbd5e1" font-size="10.5" text-anchor="start">on a schedule, 7 days kept</text><text x="1352" y="355" fill="#fbbf24" font-size="10" text-anchor="end">job</text>
<rect x="40" y="494" width="230" height="80" rx="6" fill="#0f172a"/><rect x="40" y="494" width="230" height="80" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="52" y="516" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">PVC</text><text x="52" y="532" fill="#cbd5e1" font-size="10.5" text-anchor="start">Postgres 20Gi</text><text x="52" y="548" fill="#cbd5e1" font-size="10.5" text-anchor="start">daymark schema</text>
<rect x="300" y="494" width="330" height="80" rx="6" fill="#0f172a"/><rect x="300" y="494" width="330" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="312" y="516" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Longhorn volume</text><text x="312" y="532" fill="#cbd5e1" font-size="10.5" text-anchor="start">3 replicas, one per node</text>
<rect x="660" y="494" width="250" height="80" rx="6" fill="#0f172a"/><rect x="660" y="494" width="250" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="672" y="516" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">node disks</text><text x="672" y="532" fill="#cbd5e1" font-size="10.5" text-anchor="start">local, on each Optiplex</text>
<rect x="40" y="626" width="230" height="80" rx="6" fill="#0f172a"/><rect x="40" y="626" width="230" height="80" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="52" y="648" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">PVC</text><text x="52" y="664" fill="#cbd5e1" font-size="10.5" text-anchor="start">bulk data</text><text x="52" y="680" fill="#cbd5e1" font-size="10.5" text-anchor="start">static assets, archives</text>
<rect x="300" y="626" width="330" height="80" rx="6" fill="#0f172a"/><rect x="300" y="626" width="330" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="312" y="648" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">NFS mount</text><text x="312" y="664" fill="#cbd5e1" font-size="10.5" text-anchor="start">mounted by the kubelet</text><text x="312" y="680" fill="#cbd5e1" font-size="10.5" text-anchor="start">on the node</text>
<rect x="1040" y="500" width="340" height="122" rx="6" fill="#0f172a"/><rect x="1040" y="500" width="340" height="122" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="1052" y="522" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Growing a volume</text><text x="1052" y="538" fill="#cbd5e1" font-size="10.5" text-anchor="start">edit spec.storage.size, re-apply</text><text x="1052" y="554" fill="#cbd5e1" font-size="10.5" text-anchor="start">Longhorn expands it online</text><text x="1052" y="570" fill="#cbd5e1" font-size="10.5" text-anchor="start">no downtime, no rescheduling</text><text x="1052" y="586" fill="#cbd5e1" font-size="10.5" text-anchor="start"></text><text x="1052" y="602" fill="#cbd5e1" font-size="10.5" text-anchor="start">shrinking is not supported</text><text x="1368" y="521" fill="#94a3b8" font-size="10" text-anchor="end">howto</text>
<rect x="40" y="754" width="250" height="90" rx="6" fill="#0f172a"/><rect x="40" y="754" width="250" height="90" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="52" y="776" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Backup job</text><text x="52" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="start">collects both sources</text><text x="52" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="start">from TrueNAS</text>
<rect x="340" y="754" width="300" height="90" rx="6" fill="#0f172a"/><rect x="340" y="754" width="300" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="352" y="776" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">S3 target (in-cluster)</text><text x="352" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="start">object store inside k3s</text><text x="352" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="start">the only backup destination</text>
<rect x="690" y="754" width="260" height="90" rx="6" fill="#0f172a"/><rect x="690" y="754" width="260" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="702" y="776" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">7-day retention</text><text x="702" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="start">older objects expire</text><text x="702" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="start">automatically</text>
<rect x="1000" y="754" width="380" height="90" rx="6" fill="#0f172a"/><rect x="1000" y="754" width="380" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1012" y="776" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Restore</text><text x="1012" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="start">rehydrate the etcd snapshot, then</text><text x="1012" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="start">untar the PV — nothing else is kept</text>
<text x="56" y="420" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">quorum survives one node; Longhorn keeps 3 replicas</text>
<text x="40" y="480" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">BLOCK PATH — the database and the apps</text>
<text x="285.0" y="526.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">mounts</text>
<text x="645.0" y="526.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">replicate</text>
<text x="40" y="612" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">NFS PATH — everything that just needs space</text>
<text x="967.0" y="659.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">NFS v4 · 2.5GbE</text>
<text x="40" y="740" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">BACKUP PATH — where the copies go</text>
<text x="975.0" y="791.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">disaster</text>
<text x="40" y="912" fill="#94a3b8" font-size="10" letter-spacing="1">LEGEND</text>
