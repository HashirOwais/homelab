<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="980" viewBox="0 0 1420 980" font-family="JetBrains Mono, ui-monospace, monospace" role="img" aria-label="Security">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
<marker id="am-frontend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker>
<marker id="am-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker>
<marker id="am-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker>
<marker id="am-storage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
<marker id="am-security" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker>
<marker id="am-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1420" height="980" fill="#020617"/>
<rect width="1420" height="980" fill="url(#grid)"/>
<text x="40" y="50" fill="#e2e8f0" font-size="22" font-weight="600">Security</text>
<text x="40" y="75" fill="#94a3b8" font-size="12">Five layers: segmentation, certificates, detection, least privilege, and what is deliberately not exposed</text>
<rect x="40" y="100" width="660" height="330" rx="10" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="54" y="121" fill="#fb7185" font-size="12" letter-spacing="0.6">1 · Segmentation</text>
<text x="54" y="137" fill="#94a3b8" font-size="10">deny by default; every allow is explicit</text>
<rect x="740" y="100" width="640" height="330" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="754" y="121" fill="#22d3ee" font-size="12" letter-spacing="0.6">2 · Certificates</text>
<text x="754" y="137" fill="#94a3b8" font-size="10">one wildcard, issued over DNS, renewed in place</text>
<rect x="40" y="470" width="660" height="390" rx="10" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="54" y="491" fill="#fb7185" font-size="12" letter-spacing="0.6">3 · Detection</text>
<text x="54" y="507" fill="#94a3b8" font-size="10">two lanes: metrics and logs, then host events</text>
<rect x="740" y="470" width="640" height="390" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="7 6" stroke-opacity="0.75"/>
<text x="754" y="491" fill="#a78bfa" font-size="12" letter-spacing="0.6">4 · Least privilege</text>
<text x="754" y="507" fill="#94a3b8" font-size="10">what each workload is allowed to do</text>
<path d="M 196 205 L 250 205" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#am-security)"/>
<path d="M 400 205 L 414 205 L 414 322" fill="none" stroke="#fb7185" stroke-width="1.2"/>
<path d="M 414 172 L 430 172" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#am-backend)"/>
<path d="M 414 222 L 430 222" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#am-security)"/>
<path d="M 414 272 L 430 272" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#am-security)"/>
<path d="M 414 322 L 430 322" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#am-backend)"/>
<path d="M 936 193 L 966 193" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-external)"/>
<path d="M 1146 193 L 1176 193" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-external)"/>
<path d="M 1266 226 L 1266 248 L 880 248 L 880 280" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#am-frontend)"/>
<path d="M 1006 313 L 1046 313" fill="none" stroke="#22d3ee" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-frontend)"/>
<path d="M 306 572 L 356 572" fill="none" stroke="#34d399" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-backend)"/>
<path d="M 516 572 L 556 572" fill="none" stroke="#34d399" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-backend)"/>
<path d="M 306 692 L 356 692" fill="none" stroke="#fb7185" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-security)"/>
<path d="M 516 692 L 556 692" fill="none" stroke="#fb7185" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#am-security)"/>
<rect x="56" y="170" width="140" height="70" rx="6" fill="#0f172a"/><rect x="56" y="170" width="140" height="70" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="68" y="192" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Internet</text><text x="68" y="208" fill="#cbd5e1" font-size="10.5" text-anchor="start">no open ports</text>
<rect x="250" y="170" width="150" height="70" rx="6" fill="#0f172a"/><rect x="250" y="170" width="150" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="262" y="192" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">OPNsense</text><text x="262" y="208" fill="#cbd5e1" font-size="10.5" text-anchor="start">stateful filter</text><text x="388" y="191" fill="#22d3ee" font-size="10" text-anchor="end">fw</text>
<rect x="430" y="150" width="250" height="44" rx="6" fill="#0f172a"/><rect x="430" y="150" width="250" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="442" y="172" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">MGMT VLAN</text><text x="442" y="188" fill="#cbd5e1" font-size="10.5" text-anchor="start">may reach every interface</text>
<rect x="430" y="200" width="250" height="44" rx="6" fill="#0f172a"/><rect x="430" y="200" width="250" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="442" y="222" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">IoT VLAN</text><text x="442" y="238" fill="#cbd5e1" font-size="10.5" text-anchor="start">blocked from all RFC1918</text>
<rect x="430" y="250" width="250" height="44" rx="6" fill="#0f172a"/><rect x="430" y="250" width="250" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="442" y="272" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Guest VLAN</text><text x="442" y="288" fill="#cbd5e1" font-size="10.5" text-anchor="start">blocked from all RFC1918</text>
<rect x="430" y="300" width="250" height="44" rx="6" fill="#0f172a"/><rect x="430" y="300" width="250" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="442" y="322" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Protected VLAN</text><text x="442" y="338" fill="#cbd5e1" font-size="10.5" text-anchor="start">trusted, no cross-zone</text>
<rect x="756" y="160" width="180" height="66" rx="6" fill="#0f172a"/><rect x="756" y="160" width="180" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="768" y="182" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Let's Encrypt</text><text x="768" y="198" fill="#cbd5e1" font-size="10.5" text-anchor="start">ACME v2</text>
<rect x="966" y="160" width="180" height="66" rx="6" fill="#0f172a"/><rect x="966" y="160" width="180" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="978" y="182" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Cloudflare API</text><text x="978" y="198" fill="#cbd5e1" font-size="10.5" text-anchor="start">DNS-01 TXT record</text>
<rect x="1176" y="160" width="180" height="66" rx="6" fill="#0f172a"/><rect x="1176" y="160" width="180" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="1188" y="182" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">cert-manager</text><text x="1188" y="198" fill="#cbd5e1" font-size="10.5" text-anchor="start">ClusterIssuer</text>
<rect x="756" y="280" width="250" height="66" rx="6" fill="#0f172a"/><rect x="756" y="280" width="250" height="66" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="768" y="302" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Secret wildcard-lan-tls</text><text x="768" y="318" fill="#cbd5e1" font-size="10.5" text-anchor="start">namespace kube-system</text>
<rect x="1046" y="280" width="290" height="66" rx="6" fill="#0f172a"/><rect x="1046" y="280" width="290" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="1058" y="302" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Traefik :443</text><text x="1058" y="318" fill="#cbd5e1" font-size="10.5" text-anchor="start">TLSStore default cert</text>
<rect x="56" y="530" width="250" height="84" rx="6" fill="#0f172a"/><rect x="56" y="530" width="250" height="84" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="552" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">OPNsense</text><text x="68" y="568" fill="#cbd5e1" font-size="10.5" text-anchor="start">Suricata alerts, DHCP, DNS</text><text x="294" y="551" fill="#22d3ee" font-size="10" text-anchor="end">logs</text>
<rect x="356" y="530" width="160" height="84" rx="6" fill="#0f172a"/><rect x="356" y="530" width="160" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="368" y="552" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">OTel collector</text><text x="368" y="568" fill="#cbd5e1" font-size="10.5" text-anchor="start">batches, exports</text>
<rect x="556" y="530" width="128" height="84" rx="6" fill="#0f172a"/><rect x="556" y="530" width="128" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="568" y="552" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Grafana</text><text x="568" y="568" fill="#cbd5e1" font-size="10.5" text-anchor="start">dashboards</text><text x="672" y="551" fill="#34d399" font-size="10" text-anchor="end">viz</text>
<rect x="56" y="650" width="250" height="84" rx="6" fill="#0f172a"/><rect x="56" y="650" width="250" height="84" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="672" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">k3s nodes + VMs</text><text x="68" y="688" fill="#cbd5e1" font-size="10.5" text-anchor="start">syslog, audit, file changes</text>
<rect x="356" y="650" width="160" height="84" rx="6" fill="#0f172a"/><rect x="356" y="650" width="160" height="84" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="368" y="672" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Wazuh manager</text><text x="368" y="688" fill="#cbd5e1" font-size="10.5" text-anchor="start">rules, FIM, alerts</text><text x="504" y="671" fill="#fb7185" font-size="10" text-anchor="end">siem</text>
<rect x="556" y="650" width="128" height="84" rx="6" fill="#0f172a"/><rect x="556" y="650" width="128" height="84" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="568" y="672" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Alert review</text><text x="568" y="688" fill="#cbd5e1" font-size="10.5" text-anchor="start">by hand</text>
<rect x="756" y="540" width="290" height="160" rx="6" fill="#0f172a"/><rect x="756" y="540" width="290" height="160" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="768" y="562" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Pods</text><text x="768" y="578" fill="#cbd5e1" font-size="10.5" text-anchor="start">runAsNonRoot, fixed uid</text><text x="768" y="594" fill="#cbd5e1" font-size="10.5" text-anchor="start">readOnlyRootFilesystem</text><text x="768" y="610" fill="#cbd5e1" font-size="10.5" text-anchor="start">drop ALL capabilities</text><text x="768" y="626" fill="#cbd5e1" font-size="10.5" text-anchor="start">seccomp RuntimeDefault</text><text x="768" y="642" fill="#cbd5e1" font-size="10.5" text-anchor="start">pinned image tags</text>
<rect x="1076" y="540" width="290" height="160" rx="6" fill="#0f172a"/><rect x="1076" y="540" width="290" height="160" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1088" y="562" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Postgres roles</text><text x="1088" y="578" fill="#cbd5e1" font-size="10.5" text-anchor="start">daymark_app owns one database</text><text x="1088" y="594" fill="#cbd5e1" font-size="10.5" text-anchor="start">no CREATEDB, no CREATEROLE</text><text x="1088" y="610" fill="#cbd5e1" font-size="10.5" text-anchor="start">PUBLIC CONNECT revoked</text><text x="1088" y="626" fill="#cbd5e1" font-size="10.5" text-anchor="start">sslmode=require enforced</text><text x="1088" y="642" fill="#cbd5e1" font-size="10.5" text-anchor="start">apps never get postgres</text>
<rect x="756" y="720" width="610" height="120" rx="6" fill="#0f172a"/><rect x="756" y="720" width="610" height="120" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="768" y="742" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="start">Secrets</text><text x="768" y="758" fill="#cbd5e1" font-size="10.5" text-anchor="start">two copies — namespace pg and namespace daymark — because a</text><text x="768" y="774" fill="#cbd5e1" font-size="10.5" text-anchor="start">pod cannot read a Secret across namespaces; rotate both together</text><text x="768" y="790" fill="#cbd5e1" font-size="10.5" text-anchor="start">image pull secret per namespace; nothing sensitive in git</text>
<text x="223.0" y="197.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">deny</text>
<text x="56" y="300" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">IoT and Guest cannot reach the NAS or</text>
<text x="56" y="316" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">the k3s nodes. Only the MGMT VLAN may</text>
<text x="56" y="332" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">cross to another interface, and nothing</text>
<text x="56" y="348" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">but network gear sits on it.</text>
<text x="1068.0" y="242.0" fill="#cbd5e1" font-size="10" text-anchor="middle" stroke="#020617" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">issues</text>
<text x="756" y="380" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">DNS-01 works because the zone is public; no</text>
<text x="756" y="396" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">inbound port 80 is needed, and the certificate</text>
<text x="756" y="412" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">is CN=*.lan.hashirowais.com for every host.</text>
<text x="56" y="790" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">Suricata sits inline on the firewall, so a match</text>
<text x="56" y="806" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">is visible before the packet is routed. Wazuh</text>
<text x="56" y="822" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">runs as a VM on the Proxmox host, outside k3s,</text>
<text x="56" y="838" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="400">so cluster trouble cannot blind the SIEM.</text>
<text x="40" y="897" fill="#94a3b8" font-size="10" letter-spacing="1">LEGEND</text>
<rect x="40" y="904" width="14" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="62" y="916" fill="#cbd5e1" font-size="11">firewall / ingress</text>
<rect x="212.8" y="904" width="14" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="234.8" y="916" fill="#cbd5e1" font-size="11">service / operator</text>
<rect x="385.6" y="904" width="14" height="14" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="407.6" y="916" fill="#cbd5e1" font-size="11">database / role</text>
<rect x="538.6" y="904" width="14" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="560.6" y="916" fill="#cbd5e1" font-size="11">host</text>
<rect x="619.0" y="904" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="641.0" y="916" fill="#cbd5e1" font-size="11">blocked / security</text>
<rect x="791.8" y="904" width="14" height="14" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="813.8" y="916" fill="#cbd5e1" font-size="11">external</text>
</svg>
